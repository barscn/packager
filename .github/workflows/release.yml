name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          set -eu
          name="packager-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mkdir -p "${name}"
          cp target/release/packager README.md LICENSE "${name}/"
          tar -czf "${name}.tar.gz" "${name}"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            packager-*.tar.gz
            packager-*.tar.gz.sha256
          generate_release_notes: true
