[package]
name = "packager"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
thiserror = "2"
tar = "0.4"
flate2 = "1"

[features]
default = []
system = []

# Smaller CLI: fat LTO, one CGU, stripped. panic=abort is fine — tests use unwind.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `cargo build --profile release-with-debug` when a shipped binary needs backtraces.
[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
panic = "unwind"
